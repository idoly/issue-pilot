<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue Pilot · 界面优化对照</title><style>
@font-face{font-family:Geist;src:url('../../../src/web/src/ui/assets/Geist-Variable.woff2') format('woff2');font-display:swap;font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#202522;font:14px/20px Geist,"Microsoft YaHei",system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px 48px}h1{margin:0;font-size:24px;line-height:32px;font-weight:600;text-wrap:balance}p{color:#65706c;text-wrap:pretty}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}a{color:#176b5b;text-decoration:none}a:hover{text-decoration:underline}.links{display:flex;gap:16px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:24px;padding:16px;border:1px solid #d9dfdc;border-radius:12px;background:#fff}label{display:flex;align-items:center;gap:8px;color:#65706c}select,button{font:inherit;border-radius:8px;cursor:pointer}select{min-height:40px;min-width:160px;padding:8px 12px;border:1px solid #d9dfdc;background:#fff;color:#202522;font:inherit}.segmented{display:flex;gap:4px;padding:4px;background:#edf2ef;border-radius:12px}.segmented button{min-height:32px;padding:4px 12px;border:0;background:transparent;color:#65706c;font:500 14px/20px Geist,system-ui,sans-serif;transition:background-color 200ms cubic-bezier(.32,.72,0,1),color 200ms cubic-bezier(.32,.72,0,1)}.segmented button[aria-pressed=true]{background:#fff;color:#176b5b}.segmented button:hover{color:#176b5b}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #176b5b;outline-offset:2px}.frames{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}.frames.compare{grid-template-columns:repeat(2,minmax(0,1fr))}figure{min-width:0;margin:0;padding:16px;border:1px solid #d9dfdc;border-radius:12px;background:#fff}figure[hidden]{display:none}figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:#65706c;font-size:12px;line-height:16px}figure img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #e5eae6;border-radius:4px}.note{margin:24px 0 0;font-size:12px;line-height:16px}.mobile img{max-width:min(390px,100%)}@media(max-width:700px){main{padding:24px 16px}.toolbar{gap:12px}.frames.compare{grid-template-columns:minmax(0,1fr)}.segmented button{min-height:40px}figure{padding:12px}}@media(prefers-reduced-motion:reduce){.segmented button{transition:none}}
</style></head>
<body><main><header><div><h1>Issue Pilot 界面优化对照</h1><p>实际页面截图 · 独立演示数据 · 当前改动尚未部署</p></div><nav class="links" aria-label="验收记录"><a href="../../reviews/frontend-ui-polish.md">修改与验收</a><a href="verification.json">验证数据</a></nav></header>
<div class="toolbar"><label>页面 <select id="page"><option value="users">用户与凭证</option><option value="repositories">仓库</option><option value="services">服务</option><option value="editor">服务编辑</option><option value="credential">个人凭证弹窗</option><option value="overview">运营总览</option><option value="issue">工单与对话</option><option value="endpoints">端点</option><option value="code">代码浏览器</option></select></label><div class="segmented" role="group" aria-label="页面尺寸"><button data-width="1440" aria-pressed="true">桌面 1440</button><button data-width="390" aria-pressed="false">手机 390</button></div><div class="segmented" role="group" aria-label="对照模式"><button data-view="after" aria-pressed="true">优化后</button><button data-view="before" aria-pressed="false">优化前</button><button data-view="compare" aria-pressed="false">前后对照</button></div></div>
<section class="frames" id="frames" aria-label="页面截图"><figure id="before" hidden><figcaption><span>优化前</span><a class="original" target="_blank" rel="noopener">打开原图</a></figcaption><img alt="优化前的用户页面"></figure><figure id="after"><figcaption><span>优化后</span><a class="original" target="_blank" rel="noopener">打开原图</a></figcaption><img alt="优化后的用户页面"></figure></section><p class="note">截图中的人员、凭证、工单、查询结果和仓库均为演示数据。选择“打开原图”查看原始尺寸。代码浏览器保留原有文件图标和只读能力；对照页不连接应用 API。</p></main>
<script>
let width='1440',view='after';const select=document.getElementById('page'),frames=document.getElementById('frames');function render(){frames.className='frames'+(view==='compare'?' compare':'')+(width==='390'?' mobile':'');for(const mode of['before','after']){const figure=document.getElementById(mode),src=`${mode}-${select.value}-${width}.png`;figure.hidden=view!=='compare'&&view!==mode;figure.querySelector('img').src=src;figure.querySelector('img').alt=`${mode==='before'?'优化前':'优化后'}的${select.selectedOptions[0].textContent}，${width}px`;figure.querySelector('.original').href=src}for(const button of document.querySelectorAll('[data-width]'))button.setAttribute('aria-pressed',String(button.dataset.width===width));for(const button of document.querySelectorAll('[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===view))}select.addEventListener('change',render);for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{width=button.dataset.width;render()});for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>{view=button.dataset.view;render()});render();
</script></body></html>
