<main class="wrap"><div class="page-head"><div><h1>配置</h1></div><a href="configuration-management.md" class="view-link">查看数据设计 ↗</a></div><nav class="tabs" role="tablist" aria-label="配置分类"></nav><div id="content"></div></main>
<div class="statusbar"><span>交互原型 · 演示数据 <button class="subtle reset-button" data-action="reset-demo">重置</button></span></div>
<dialog id="editor"><form id="form"></form></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const SEED={users:[{id:'lin',name:'林安',email:'lin@example.test',role:'developer',admin:true,active:true},{id:'chen',name:'陈晨',email:'chen@example.test',role:'test',admin:false,active:true},{id:'zhou',name:'周宁',email:'zhou@example.test',role:'product',admin:false,active:true},{id:'gao',name:'高远',email:'gao@example.test',role:'developer',admin:false,active:false}],repos:[{id:'orders-api',name:'orders-api',url:'git@example.test:business/orders-api.git'},{id:'orders-web',name:'orders-web',url:'git@example.test:business/orders-web.git'},{id:'shared-auth',name:'shared-auth',url:'git@example.test:platform/shared-auth.git'}],services:[{id:'orders',name:'订单服务',description:'订单创建、履约与售后。调查时优先核对订单状态与履约日志。',issueCount:12,repos:['orders-api','orders-web'],branches:{prod:{'orders-api':'release/prod','orders-web':'main'},test:{'orders-api':'release/test','orders-web':'test'},dev:{}},evidence:{prod:{dms:[{alias:'ORDERS-PROD',schema:'orders'},{alias:'ORDERS-ARCHIVE',schema:'orders_history'}],sls:[{name:'应用日志',region:'cn-hangzhou',project:'orders-prod',logstores:['application','job']},{name:'网关日志',region:'cn-shanghai',project:'gateway-prod',logstores:['access','error']}]},test:{mysql:[{database:'orders_test',host:'db-orders.test.example.test',port:3306,username:'reader',password:'demo-readonly-password'}],sls:[{name:'测试应用日志',region:'cn-hangzhou',project:'orders-test',logstores:['application','debug']}]}}},{id:'identity',name:'账号服务',description:'统一登录与权限校验。',issueCount:5,repos:['shared-auth'],branches:{prod:{'shared-auth':'main'},test:{'shared-auth':'test'}},evidence:{prod:{sls:[{name:'访问日志',region:'cn-hangzhou',project:'identity-prod',logstores:['access']}]},test:{sls:[{name:'测试访问日志',region:'cn-hangzhou',project:'identity-test',logstores:['access','debug']}]}}}],credentials:{model:true,ssh:true,dms:false,sls:false}};
const KEY='issue-pilot-config-prototype-v6';let state;try{state=JSON.parse(sessionStorage.getItem(KEY))||structuredClone(SEED)}catch{state=structuredClone(SEED)}
let tab='users',selected='orders',userFilter='',showInactive=false,editing=null,serviceDraft=null,endpointFormat='json';
let currentSubject=sessionStorage.getItem(KEY+'-identity')||'lin';
function currentUser(){return state.users.find(user=>user.id===currentSubject&&user.active)||state.users.find(user=>user.active)}
function myCredentials(){state.personalCredentials??={lin:state.credentials};return state.personalCredentials[currentUser().id]??=( {model:false,ssh:false,dms:false,sls:false} )}
function myCredentialDetails(){state.personalCredentialDetails??={};return state.personalCredentialDetails[currentUser().id]??={}}
function canManage(){return currentUser()?.role==='developer'}
const roles={product:'产品',test:'测试',developer:'开发'},envs={prod:'正式',test:'测试',dev:'开发'},credLabels={model:'API Key',ssh:'SSH Key',dms:'DMS',sls:'SLS'};
const tabs=document.querySelector('.tabs'),content=document.querySelector('#content'),dialog=document.querySelector('#editor'),form=document.querySelector('#form');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(label,style='')=>`<span class="tag ${style}">${esc(label)}</span>`;
const save=()=>sessionStorage.setItem(KEY,JSON.stringify(state));
let toastTimer;function toast(text='已保存'){const node=document.querySelector('#toast');node.textContent=text;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,2600)}
const envOrder=['dev','test','prod'];
function applyAccess(){content.querySelectorAll('[data-action="service"],[data-action="repo"],[data-action="user"],[data-action="toggle-user"],[data-action="delete-repo"]').forEach(button=>button.disabled=!canManage());content.querySelectorAll('[data-action="credential"][data-id="model"],[data-action="credential"][data-id="ssh"]').forEach(button=>button.disabled=!canManage());if(!currentUser().admin)content.querySelectorAll('[data-action="user"],[data-action="toggle-user"]').forEach(button=>{if(state.users.find(user=>user.id===button.dataset.id)?.admin)button.disabled=true})}
function render(){const active=currentUser();currentSubject=active.id;document.querySelector('#demo-user').innerHTML=state.users.filter(user=>user.active).map(user=>`<option value="${esc(user.id)}" ${user.id===active.id?'selected':''}>${esc(user.name)} · ${roles[user.role]}</option>`).join('');tabs.innerHTML=[['users','用户'],['repos','仓库'],['services','服务'],['endpoints','端点']].map(([key,label])=>`<button role="tab" data-tab="${key}" aria-selected="${tab===key}">${label}</button>`).join('');if(tab==='services')renderServices();if(tab==='users')renderUsers();if(tab==='repos')renderRepos();if(tab==='endpoints')renderEndpoints();applyAccess()}
function configuredBranch(service,environment,repository){return (service.branches[environment==='dev'?'prod':environment]?.[repository]||'').trim()}
function sourceKinds(service,environment){const targets=service.evidence?.[environment]||{};return ['mysql','dms','sls'].filter(kind=>targets[kind]?.length)}
function environmentSources(service,environment){
  if(environment==='dev')return `<div class="dev-source-note"><span>查询来源</span><div class="actions">${['prod','test'].filter(key=>service.branches[key]).map(key=>`<button class="subtle" data-source-env="${key}">${envs[key]} ↗</button>`).join('')}</div></div>`;
  const targets=service.evidence?.[environment]||{};
  if(!sourceKinds(service,environment).length)return '<p class="muted">此环境未配置外部查询目标。</p>';
  return `${targets.mysql?.length?`<div class="source-target-group"><div class="source-target-heading"><h5>MySQL</h5></div><div class="table-scroll"><table class="target-table"><thead><tr><th>host</th><th>port</th><th>username</th><th>password</th><th>database</th></tr></thead><tbody>${targets.mysql.map(target=>`<tr><td><code>${esc(target.host)}</code></td><td><code>${target.port}</code></td><td><code>${esc(target.username)}</code></td><td><code>${esc(target.password)}</code></td><td><code>${esc(target.database)}</code></td></tr>`).join('')}</tbody></table></div></div>`:''}${targets.dms?.length?`<div class="source-target-group"><div class="source-target-heading"><h5>DMS</h5></div><div class="table-scroll"><table class="target-table"><thead><tr><th>alias</th><th>schema</th></tr></thead><tbody>${targets.dms.map(target=>`<tr><td><code>${esc(target.alias)}</code></td><td><code>${esc(target.schema)}</code></td></tr>`).join('')}</tbody></table></div></div>`:''}${targets.sls?.length?`<div class="source-target-group"><div class="source-target-heading"><h5>SLS</h5></div><div class="table-scroll"><table class="target-table"><thead><tr>${targets.sls.some(target=>target.name)?'<th>name</th>':''}<th>region</th><th>project</th><th>logstores</th></tr></thead><tbody>${targets.sls.map(target=>`<tr>${targets.sls.some(value=>value.name)?`<td>${esc(target.name||'—')}</td>`:''}<td><code>${esc(target.region)}</code></td><td><code>${esc(target.project)}</code></td><td>${target.logstores.map(name=>`<code class="logstore">${esc(name)}</code>`).join('')}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
function renderServices(){const service=state.services.find(s=>s.id===selected)||state.services[0];if(service)selected=service.id;const enabled=service?envOrder.filter(e=>service.branches[e]):[];content.innerHTML=`<section class="panel service-workspace"><div class="service-bar"><nav class="service-tab-list" role="tablist" aria-label="服务列表">${state.services.map(s=>`<button role="tab" data-service="${s.id}" aria-selected="${s.id===selected}" title="${esc(s.name)}">${esc(s.name)}</button>`).join('')}</nav><div class="actions"><button data-action="service">＋ 添加</button>${service?`<button class="primary" data-action="service" data-id="${service.id}">编辑</button>`:''}</div></div><article class="service-detail service-current" role="tabpanel" aria-label="服务详情">${service?`<h2>代码分支</h2><div class="table-scroll"><table class="branch-table current-matrix"><thead><tr><th>仓库</th>${enabled.map(e=>`<th>${envs[e]}${e==='dev'?'<small class="branch-inherited-tag">继承正式</small>':''}</th>`).join('')}</tr></thead><tbody>${service.repos.map(id=>{const r=state.repos.find(r=>r.id===id);return `<tr><td title="${esc(r.url)}"><strong>⑂ ${esc(r.name)}</strong></td>${enabled.map(e=>`<td title="${e==='dev'?'继承正式分支':''}"><code>${esc(configuredBranch(service,e,id)||(e==='dev'?'待配置正式分支':'—'))}</code></td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="divider"></div><h3>服务描述</h3><div class="current-description"><p>${esc(service.description||'暂无描述')}</p>${enabled.map(e=>`<section class="generated-environment" id="source-${e}"><h4>${envs[e]}环境</h4>${environmentSources(service,e)}</section>`).join('')}</div>`:'<div class="empty">暂无服务</div>'}</article></section>`;content.querySelector('.service-tab-list [aria-selected="true"]')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function renderUsers(){const users=state.users.filter(u=>(showInactive||u.active)&&`${u.name} ${u.email}`.toLowerCase().includes(userFilter.toLowerCase()));content.innerHTML=`<section class="panel"><div class="panel-head"><div class="stack"><h2>我的凭证</h2><span class="muted">${esc(currentUser().name)} · ${esc(currentUser().email)}</span></div></div><div class="credential-grid">${Object.entries(credLabels).map(([key,label])=>`<div class="credential"><h3>${label}</h3>${tag(myCredentials()[key]?'已配置':'未配置',myCredentials()[key]?'green':'')}<button data-action="credential" data-id="${key}">${myCredentials()[key]?'更新凭证':'设置凭证'}</button></div>`).join('')}</div></section><section class="panel section-gap"><div class="panel-head"><div class="stack"><h2>人员</h2></div><button class="primary" data-action="user">＋ 添加人员</button></div><div class="users-toolbar"><input aria-label="搜索人员" value="${esc(userFilter)}" placeholder="搜索姓名或邮箱"><label class="muted"><input type="checkbox" id="inactive" ${showInactive?'checked':''}> 显示停用人员</label></div><div class="table-scroll"><table class="users-table"><thead><tr><th>成员</th><th>角色</th><th class="optional">管理权限</th><th>状态</th><th></th></tr></thead><tbody>${users.map(u=>`<tr class="${u.active?'':'disabled-row'}"><td><div class="person"><span class="avatar">${esc(u.name[0])}</span><div><strong>${esc(u.name)}${u.id===currentUser().id?' <small style="display:inline">我</small>':''}</strong><small>${esc(u.email)}</small></div></div></td><td>${roles[u.role]}</td><td class="optional">${u.admin?'可管理配置':'—'}</td><td>${tag(u.active?'在用':'已停用',u.active?'green':'')}</td><td><div class="actions"><button class="subtle" data-action="user" data-id="${u.id}">编辑</button><button class="subtle ${u.active?'danger':''}" data-action="toggle-user" data-id="${u.id}">${u.active?'停用':'启用'}</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">没有匹配人员</td></tr>'}</tbody></table></div></section>`}
function renderRepos(){content.innerHTML=`<section class="panel"><div class="panel-head"><div class="stack"><h2>仓库</h2></div><button class="primary" data-action="repo">＋ 登记仓库</button></div><div class="table-scroll"><table class="users-table repo-table"><thead><tr><th>仓库</th><th class="address">地址</th><th>使用服务</th><th></th></tr></thead><tbody>${state.repos.map(r=>{const used=state.services.filter(s=>s.repos.includes(r.id));return `<tr><td><strong>${esc(r.name)}</strong></td><td class="address"><code>${esc(r.url)}</code></td><td><div class="usage">${used.map(s=>`<button class="subtle" data-service="${s.id}">${esc(s.name)} ↗</button>`).join('')||'<span class="muted">未关联</span>'}</div></td><td><div class="actions"><button class="subtle" data-action="repo" data-id="${r.id}">编辑</button>${used.length?'':`<button class="subtle danger" data-action="delete-repo" data-id="${r.id}">删除</button>`}</div></td></tr>`}).join('')}</tbody></table></div></section>`}
function renderEndpoints(){const user=currentUser();const url='https://issue-pilot.example.test/mcp';const config=endpointFormat==='codex'?`[mcp_servers.issue-pilot]\nurl = "${url}"\nhttp_headers = { "X-Issue-Pilot-Subject" = "${user.id}" }`:JSON.stringify({[endpointFormat==='vscode'?'servers':'mcpServers']:{'issue-pilot':{type:'http',url,headers:{'X-Issue-Pilot-Subject':user.id}}}},null,2);content.innerHTML=`<section class="panel endpoint-panel" aria-label="端点说明"><div class="panel-head"><div class="stack"><h2>Issue Pilot MCP</h2></div>${tag('Streamable HTTP','green')}</div><div class="endpoint-body"><div class="endpoint-toolbar"><label><span>接入客户端</span><select id="endpoint-format" aria-label="接入客户端"><option value="json" ${endpointFormat==='json'?'selected':''}>Pi / Cursor / Claude Code</option><option value="vscode" ${endpointFormat==='vscode'?'selected':''}>VS Code</option><option value="codex" ${endpointFormat==='codex'?'selected':''}>Codex</option></select></label><button class="primary" data-action="copy-endpoint">复制配置</button></div><p class="muted endpoint-guidance">${endpointFormat==='codex'?'追加到 ~/.codex/config.toml。':endpointFormat==='vscode'?'将 servers 条目加入 .vscode/mcp.json。':'将 mcpServers 条目加入客户端已有 MCP 配置。'}</p><div class="endpoint-identity">连接身份：<strong>${esc(user.name)}</strong> <code>${esc(user.id)}</code></div><pre class="endpoint-code" tabindex="0" aria-label="MCP 客户端配置">${esc(config)}</pre><p class="muted endpoint-guidance">入口认证在客户端配置。</p><details class="endpoint-tools"><summary>可用工具（11）</summary>${[['services_list','列出服务和环境'],['users_list','确认连接身份与可分配人员'],['issues_search','搜索工单'],['issue_get','读取工单详情与运行状态'],['issue_create','创建工单并上传附件'],['dingtalk_import','通过全局钉钉连接导入记录'],['issue_message','补充消息或继续处理'],['issue_conversation','读取对话和进展'],['attachment_read','读取附件'],['work_files','浏览工作目录'],['work_file_read','按相对路径读取工作文件']].map(([name,description])=>`<div class="endpoint-tool"><code>${name}</code><span>${description}</span></div>`).join('')}</details></div></section>`}
function shell(title,subtitle,body,foot='保存',note=''){const scrollTop=dialog.open&&editing?.kind==='service'?(form.querySelector('.modal-body')?.scrollTop||0):0;form.innerHTML=`<div class="modal-header"><div class="stack"><h2>${title}</h2>${subtitle?`<span class="muted">${subtitle}</span>`:''}</div><button type="button" class="subtle" data-action="cancel" aria-label="关闭编辑">✕</button></div><div class="modal-body"><div class="error" role="alert" id="form-error"></div>${body}</div><div class="modal-footer">${note?`<small>${note}</small>`:'<span></span>'}<div class="actions"><button type="button" data-action="cancel">取消</button><button type="submit" class="primary">${foot}</button></div></div>`;form.querySelector('.modal-body').scrollTop=scrollTop}
const field=(label,name,value='',extra='')=>`<label class="field"><span>${label}</span><input name="${name}" aria-label="${label}" value="${esc(value)}" ${extra}></label>`;
function open(kind,id){if(kind==='credential'&&['model','ssh'].includes(id)&&!canManage())return toast('此凭证需开发角色维护');if(kind==='user'&&!currentUser().admin&&state.users.find(user=>user.id===id)?.admin)return toast('需要管理权限');editing={kind,id};dialog.classList.toggle('credential-dialog',kind==='credential');if(kind==='service'){const s=state.services.find(s=>s.id===id);serviceDraft=s?structuredClone(s):{name:'',description:'',repos:[],branches:{prod:{},test:{},dev:{}},evidence:{}};serviceDraft.openEnvs=[];for(const environment of envOrder)serviceDraft.branches[environment]??={};serviceForm()}
if(kind==='user'){const u=state.users.find(u=>u.id===id)||{role:'product',admin:false};shell(id?'编辑人员':'添加人员','',`<div class="cols">${field('姓名','name',u.name,'required')}${field('邮箱','email',u.email,'type="email" required')}</div><div class="cols"><label class="field"><span>角色</span><select name="role" aria-label="角色">${Object.entries(roles).map(([key,name])=>`<option value="${key}" ${u.role===key?'selected':''}>${name}</option>`).join('')}</select></label><label class="field"><span>配置管理</span><select name="admin" aria-label="配置管理"><option value="false" ${!u.admin?'selected':''}>普通权限</option><option value="true" ${u.admin?'selected':''}>管理权限</option></select></label></div>`,'保存人员')}
if(kind==='repo'){const r=state.repos.find(r=>r.id===id)||{};const used=state.services.filter(s=>s.repos.includes(id));shell(id?'编辑仓库':'登记仓库','',`${field('仓库地址','url',r.url,'required placeholder="git@example.test:team/repo.git"')}${field('显示名称','name',r.name,'placeholder="默认使用仓库名"')}${used.length?`<div class="notice">使用服务：${used.map(s=>esc(s.name)).join('、')}</div>`:''}`,'保存仓库')}
if(kind==='credential'){credentialForm()}
const inputAdmin=form.elements.admin;if(inputAdmin&&!currentUser().admin)inputAdmin.disabled=true;
if(!dialog.open)dialog.showModal()}
function credentialForm(){const k=editing.id,configured=myCredentials()[k];const hint=configured?'留空保留原值':'请输入新值';const fields={model:field('API Key','secret','',`type="password" autocomplete="new-password" placeholder="${hint}"`),ssh:`<label class="field"><span>SSH 私钥</span><textarea name="secret" aria-label="SSH 私钥" placeholder="${hint}"></textarea></label>`,dms:field('DMS 地址','url',configured?(myCredentialDetails().dmsUrl||''):'','placeholder="https://dms.example.test/sse"')+field('Authorization','secret','',`type="password" autocomplete="new-password" placeholder="${hint}"`),sls:field('AccessKey ID','key','',`autocomplete="off" placeholder="${configured?'留空保留原值':'请输入 AccessKey ID'}"`)+field('AccessKey Secret','secret','',`type="password" autocomplete="new-password" placeholder="${hint}"`)};shell(configured?`更新 ${credLabels[k]}`:`设置 ${credLabels[k]}`,'',fields[k],'保存',configured?'<button type="button" class="subtle danger" data-action="clear-credential">清除凭证</button>':'')}
const targetFields={mysql:['host','port','username','password','database'],dms:['alias','schema'],sls:['name','region','project','logstores']};
function targetEditors(environment){const groups=serviceDraft.evidence[environment]||{};return `<div class="target-editors">${['mysql','dms','sls'].map(kind=>`<section class="target-category" data-kind="${kind}"><div class="target-category-head"><strong>${kind==='mysql'?'MySQL':kind.toUpperCase()}</strong><button type="button" class="subtle" data-action="add-target" data-environment="${environment}" data-kind="${kind}" aria-label="添加 ${kind==='mysql'?'MySQL':kind.toUpperCase()}">＋ 添加</button></div>${(groups[kind]||[]).map((target,index)=>`<div class="target-edit-row" data-target-env="${environment}" data-target-kind="${kind}" data-target-index="${index}"><div class="target-edit-head"><span>目标 ${index+1}</span><button type="button" class="subtle danger" data-action="remove-target" data-environment="${environment}" data-kind="${kind}" data-index="${index}" aria-label="移除目标 ${index+1}">移除</button></div><div class="target-fields">${targetFields[kind].map(key=>`<label class="field"><span>${key}${key==='name'?'（可选）':''}</span><input data-target-key="${key}" aria-label="${kind} ${environment} ${index+1} ${key}" ${key==='port'?'type="number" min="1" max="65535"':''} ${key==='name'?'':'required'} value="${esc(Array.isArray(target[key])?target[key].join(', '):target[key])}" placeholder="${key==='logstores'?'多个日志库用逗号分隔':''}"></label>`).join('')}</div></div>`).join('')||'<p class="muted target-empty">未配置</p>'}</section>`).join('')}</div>`}
function serviceForm(){const s=serviceDraft;s.branches.dev={};for(const environment of ['test','prod'])for(const id of s.repos)s.branches[environment][id]??='main';shell(editing.id?'编辑服务':'添加服务','',`${field('服务名称','name',s.name,'required placeholder="例如：库存服务"')}<div class="form-section">关联仓库</div><div class="repo-options">${state.repos.map(r=>`<label class="repo-option"><input type="checkbox" name="repo" value="${r.id}" ${s.repos.includes(r.id)?'checked':''}><span><strong>${esc(r.name)}</strong><small>${esc(r.url)}</small></span></label>`).join('')}</div><div class="form-section">环境部署</div>${envOrder.map(e=>`<details class="deployment-row" data-env="${e}" ${s.openEnvs.includes(e)?'open':''}><summary><span>${envs[e]}环境</span><span class="deployment-summary">${s.branches[e]?s.repos.length+' 个仓库'+(e==='dev'?' · 继承正式分支':sourceKinds(s,e).length?' · '+sourceKinds(s,e).map(key=>key.toUpperCase()).join(' / '):''):'未启用'}</span></summary><div class="deployment-body">${e==='dev'?'<p class="development-inheritance">查询能力继承正式／测试环境。</p>':''}${s.branches[e]?s.repos.length?s.repos.map(id=>e==='dev'?`<div class="field branch-field"><span>${esc(state.repos.find(r=>r.id===id).name)}</span><div class="inherited-branch"><code data-dev-branch="${id}" aria-label="${esc(state.repos.find(r=>r.id===id).name)} 开发基线">${esc(configuredBranch(s,'dev',id)||'待配置正式分支')}</code></div></div>`:`<label class="field branch-field"><span>${esc(state.repos.find(r=>r.id===id).name)}</span><input aria-label="${esc(state.repos.find(r=>r.id===id).name)} ${envs[e]}分支" data-branch="${e}:${id}" value="${esc(s.branches[e][id]??'main')}" required></label>`).join(''):'<p class="muted">先选择关联仓库，再填写分支。</p>':''}${e!=='dev'&&s.branches[e]?targetEditors(e):''}</div></details>`).join('')}<label class="field section-gap"><span>服务描述（Markdown）</span><textarea name="description" aria-label="服务描述" placeholder="记录业务知识、排查步骤和查询范例">${esc(s.description)}</textarea></label>${editing.id?`<div class="service-delete"><button type="button" class="subtle danger" data-action="delete-service">删除服务</button>${s.issueCount?`<small>已有 ${s.issueCount} 个历史工单，不能删除。</small>`:''}</div>${s.confirmDelete?'<div class="delete-confirm"><p>删除服务及当前部署配置？关联仓库仍保留。</p><button type="button" data-action="cancel-delete-service">取消删除</button> <button type="button" class="danger" data-action="confirm-delete-service">确认删除服务</button></div>':''}`:''}`,'保存服务')}
function syncService(){if(!serviceDraft)return;serviceDraft.name=form.elements.name.value;serviceDraft.description=form.elements.description.value;serviceDraft.openEnvs=[...form.querySelectorAll('details[data-env][open]')].map(node=>node.dataset.env);form.querySelectorAll('[data-branch]').forEach(input=>{const[e,id]=input.dataset.branch.split(':');if(serviceDraft.branches[e])serviceDraft.branches[e][id]=input.value});form.querySelectorAll('.target-edit-row').forEach(row=>{const target=serviceDraft.evidence[row.dataset.targetEnv][row.dataset.targetKind][Number(row.dataset.targetIndex)];row.querySelectorAll('[data-target-key]').forEach(input=>{const key=input.dataset.targetKey;target[key]=key==='port'?Number(input.value):key==='logstores'?input.value.split(/[,，\n]/).map(value=>value.trim()).filter(Boolean):input.value.trim();if(key==='name'&&!target[key])delete target[key]})})}
function fail(text){document.querySelector('#form-error').textContent=text}
function persist(){save();dialog.close();render();toast()}
document.addEventListener('click',event=>{const t=event.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}const s=event.target.closest('[data-service]');if(s){selected=s.dataset.service;tab='services';render();return}const source=event.target.closest('[data-source-env]');if(source){document.querySelector('#source-'+source.dataset.sourceEnv)?.scrollIntoView({block:'start',behavior:'smooth'});return}const b=event.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(['service','repo','user','toggle-user','delete-repo','add-target','remove-target','delete-service','confirm-delete-service'].includes(action)&&!canManage())return toast('当前角色只能查看配置');if(action==='add-target'){syncService();const env=b.dataset.environment,kind=b.dataset.kind;serviceDraft.evidence[env]??={};serviceDraft.evidence[env][kind]??=[];serviceDraft.evidence[env][kind].push(kind==='mysql'?{host:'',port:3306,username:'',password:'',database:''}:kind==='dms'?{alias:'',schema:''}:{name:'',region:'',project:'',logstores:[]});serviceForm();const added=form.querySelector(`details[data-env="${env}"] .target-category[data-kind="${kind}"] .target-edit-row:last-child input`);added?.focus({preventScroll:true});added?.scrollIntoView({block:'nearest'});return}if(action==='remove-target'){syncService();serviceDraft.evidence[b.dataset.environment][b.dataset.kind].splice(Number(b.dataset.index),1);serviceForm();const add=form.querySelector(`details[data-env="${b.dataset.environment}"] .target-category[data-kind="${b.dataset.kind}"] [data-action="add-target"]`);add?.focus({preventScroll:true});add?.scrollIntoView({block:'nearest'});return}if(action==='delete-service'){syncService();if(serviceDraft.issueCount)return fail('该服务已有历史工单，不能删除');serviceDraft.confirmDelete=true;serviceForm();return}if(action==='cancel-delete-service'){syncService();serviceDraft.confirmDelete=false;serviceForm();return}if(action==='confirm-delete-service'){if(serviceDraft.issueCount)return fail('该服务已有历史工单，不能删除');state.services=state.services.filter(service=>service.id!==editing.id);selected=state.services[0]?.id;tab='services';persist();toast('服务已删除，仓库仍保留');return}if(action==='cancel'){dialog.close();return}if(action==='clear-credential'){myCredentials()[editing.id]=false;if(editing.id==='dms')delete myCredentialDetails().dmsUrl;persist();toast('凭证已清除');return}if(action==='copy-endpoint'){const code=document.querySelector('[aria-label="MCP 客户端配置"]');navigator.clipboard?.writeText(code.textContent).then(()=>toast('已复制配置')).catch(()=>toast('复制失败，请选中配置手动复制'));if(!navigator.clipboard)toast('请选中配置手动复制');return}if(action==='reset-demo'){sessionStorage.removeItem(KEY);sessionStorage.removeItem(KEY+'-identity');state=structuredClone(SEED);currentSubject='lin';selected='orders';tab='users';userFilter='';showInactive=false;render();toast('已重置');return}if(action==='toggle-user'){const u=state.users.find(u=>u.id===id);if(u.active&&u.admin&&u.role==='developer'&&state.users.filter(v=>v.active&&v.admin&&v.role==='developer').length===1)return toast('至少保留一位在用的开发管理人员');u.active=!u.active;save();renderUsers();toast(u.active?'人员已启用':'人员已停用');return}if(action==='delete-repo'){if(state.services.some(s=>s.repos.includes(id)))return toast('仓库仍被服务使用');state.repos=state.repos.filter(r=>r.id!==id);save();renderRepos();toast('未使用仓库已删除');return}open(action,id)});
form.addEventListener('input',event=>{if(editing?.kind!=='service'||!event.target.dataset.branch?.startsWith('prod:'))return;const id=event.target.dataset.branch.slice(5);serviceDraft.branches.prod[id]=event.target.value;form.querySelectorAll('[data-dev-branch]').forEach(output=>{output.textContent=configuredBranch(serviceDraft,'dev',output.dataset.devBranch)||'待配置正式分支'})});
form.addEventListener('change',event=>{if(editing?.kind!=='service')return;if(event.target.name==='repo'){syncService();serviceDraft.repos=[...form.querySelectorAll('[name=repo]:checked')].map(n=>n.value);serviceForm()}});
content.addEventListener('input',event=>{if(event.target.getAttribute('aria-label')==='搜索人员'){userFilter=event.target.value;const position=event.target.selectionStart;renderUsers();applyAccess();const field=content.querySelector('[aria-label="搜索人员"]');field.focus();field.setSelectionRange(position,position)}});
content.addEventListener('change',event=>{if(event.target.id==='inactive'){showInactive=event.target.checked;renderUsers();applyAccess()}if(event.target.id==='endpoint-format'){endpointFormat=event.target.value;renderEndpoints()}});
form.addEventListener('submit',event=>{event.preventDefault();if(['service','repo','user'].includes(editing?.kind)&&!canManage())return fail('当前角色只能查看配置');const data=Object.fromEntries(new FormData(form));if(editing.kind==='service'){syncService();if(!serviceDraft.repos.length)return fail('至少选择一个仓库');if(!Object.keys(serviceDraft.branches).length)return fail('至少启用一个环境');const s=structuredClone(serviceDraft);delete s.openEnvs;delete s.confirmDelete;for(const env of Object.keys(s.branches))s.branches[env]=env==='dev'?{}:Object.fromEntries(s.repos.map(id=>[id,s.branches[env][id]||'']));s.evidence=Object.fromEntries(Object.entries(s.evidence).filter(([env])=>env!=='dev'&&s.branches[env]));if(s.issueCount&&Object.keys(state.services.find(service=>service.id===editing.id).branches).some(env=>!s.branches[env]))return fail('该环境已有历史工单，不能直接移除');if(!s.name.trim())return fail('请填写服务名称');for(const env of Object.keys(s.evidence)){const targets=s.evidence[env].sls||[];if(targets.length>1&&(targets.some(target=>!target.name)||new Set(targets.map(target=>target.name)).size!==targets.length))return fail('多个 SLS 目标需填写不同名称')}const existing=state.services.find(v=>v.id===editing.id);if(existing)Object.assign(existing,s);else{let id=s.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||`service-${state.services.length+1}`;if(state.services.some(v=>v.id===id))id+='-'+state.services.length;s.id=id;state.services.push(s)}selected=s.id;tab='services';persist();return}if(editing.kind==='repo'){const url=data.url.trim(),name=data.name.trim()||url.split(/[/:]/).at(-1).replace(/\.git$/,'');if(state.repos.some(r=>r.id!==editing.id&&r.url===url))return fail('此地址已经登记，请复用已有仓库');const r=state.repos.find(r=>r.id===editing.id);if(r)Object.assign(r,{url,name});else state.repos.push({id:crypto.randomUUID(),url,name});persist();return}if(editing.kind==='user'){const u=state.users.find(u=>u.id===editing.id);if(state.users.some(v=>v.id!==editing.id&&v.email===data.email))return fail('邮箱已存在');if(u?.admin&&u.role==='developer'&&(data.admin!=='true'||data.role!=='developer')&&state.users.filter(v=>v.active&&v.admin&&v.role==='developer').length===1)return fail('至少保留一位在用的开发管理人员');const values={name:data.name.trim(),email:data.email.trim(),role:data.role,admin:data.admin==='true'};if(u)Object.assign(u,values);else state.users.push({...values,id:data.email.toLowerCase(),active:true});persist();return}if(editing.kind==='credential'){const k=editing.id,secret=data.secret?.trim(),hasKey=data.key?.trim();if(!secret&&!hasKey){if(k==='dms'&&myCredentials()[k]&&data.url?.trim()!==myCredentialDetails().dmsUrl)return fail('更换地址时请填写 Authorization');if(myCredentials()[k]){dialog.close();toast('保留原有凭证');return}return fail('请填写凭证')}if(!secret)return fail('请同时填写完整凭证');if(k==='sls'&&!hasKey)return fail('请同时填写 AccessKey ID 和 Secret');if(k==='dms'&&!data.url?.trim())return fail('请填写 DMS 地址');if(k==='dms')myCredentialDetails().dmsUrl=data.url.trim();myCredentials()[k]=true;persist()}});
dialog.addEventListener('close',()=>{form.innerHTML='';serviceDraft=null;editing=null});
document.addEventListener('change',event=>{if(event.target.id==='demo-user'){if(dialog.open)dialog.close();currentSubject=event.target.value;sessionStorage.setItem(KEY+'-identity',currentSubject);userFilter='';showInactive=false;render()}});
render();
</script>
</body>
