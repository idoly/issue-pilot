version: 2

# Deployment/native query groups and globally configured MCP connections.
shared:
  sls:
    accessKeyId: "${SLS_ACCESS_KEY_ID}"
    accessKeySecret: "${SLS_ACCESS_KEY_SECRET}"
  dms:
    url: https://dms.example.com/sse
    authorization: "${DMS_AUTHORIZATION}"
  dingtalk:
    apiKey: "${DINGTALK_MCP_KEY}"
    fields:
      title: 序号
      description: 工单描述
      number: 序号
      attachments: 附件

users:
  user@example.com:
    apiKeys:
      xhgj: "${MODEL_API_KEY}"
    ssh:
      privateKey: "${GIT_SSH_PRIVATE_KEY}"
    sls:
      accessKeyId: "${USER_SLS_ACCESS_KEY_ID}"
      accessKeySecret: "${USER_SLS_ACCESS_KEY_SECRET}"
    dms:
      url: https://dms.example.com/sse
      authorization: "${USER_DMS_AUTHORIZATION}"
    dingtalk:
      apiKey: "${USER_DINGTALK_MCP_KEY}"
      source:
        mcp: dingtalk
        url: https://alidocs.dingtalk.com/notable/record?dentryUuid=YOUR_BASE_ID&sheetId=YOUR_TABLE_ID&rowId=YOUR_RECORD_ID
        assignee: 示例用户
        intervalMinutes: 15
  another@example.com:
    apiKeys: {}
    ssh: {}
    sls: {}
    dms: {}
    dingtalk: {}
