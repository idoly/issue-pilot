apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: issue-pilot
  labels:
    app.kubernetes.io/name: issue-pilot
spec:
  serviceName: issue-pilot
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: issue-pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue-pilot
    spec:
      serviceAccountName: issue-pilot
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: localhost/issue-pilot:0.1.0-node24-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --experimental-strip-types
            - src/http/production.ts
          args:
            - --container-runtime=unavailable
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOME
              value: /home/issue-pilot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /opt/issue-pilot/.issue-pilot
            - name: tmp
              mountPath: /tmp
            - name: pi-agent
              mountPath: /home/issue-pilot/.pi/agent
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: pi-agent
          secret:
            secretName: issue-pilot-pi-agent
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          app.kubernetes.io/name: issue-pilot
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
