apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-pilot
  labels:
    app.kubernetes.io/name: issue-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: issue-pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue-pilot
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        issue-pilot/state: "true"
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: registry.example.com/issue-pilot:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOME
              value: /home/issue-pilot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /opt/issue-pilot/.issue-pilot
            - name: tmp
              mountPath: /tmp
            - name: runtime-config
              mountPath: /home/issue-pilot
              readOnly: true
            - name: npm-cache
              mountPath: /home/issue-pilot/.npm
            - name: maven-cache
              mountPath: /home/issue-pilot/.m2/repository
      volumes:
        - name: state
          hostPath:
            path: /var/lib/issue-pilot
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: runtime-config
          hostPath:
            path: /etc/issue-pilot
            type: Directory
        - name: npm-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: maven-cache
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: issue-pilot
  labels:
    app.kubernetes.io/name: issue-pilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: issue-pilot
  ports:
    - name: http
      port: 3000
      targetPort: http
