name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          python3 -m venv .venv
          .venv/bin/python3 -m pip install -r requirements.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: SSH transport fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman fonts-noto-cjk openssl
          npm run test:ssh
      - name: Real SLS CLI protocol acceptance
        run: |
          cli_version=$(sed -n 's/^ARG ALIYUN_CLI_VERSION=//p' Containerfile)
          cli_root="${RUNNER_TEMP}/issue-pilot-aliyun"
          mkdir -p "$cli_root"
          curl --fail --location --silent --show-error "https://aliyuncli.alicdn.com/aliyun-cli-linux-${cli_version}-$(dpkg --print-architecture).tgz" --output "$cli_root/aliyun.tgz"
          tar --extract --gzip --file "$cli_root/aliyun.tgz" --directory "$cli_root" aliyun
          test "$("$cli_root/aliyun" version)" = "$cli_version"
          PATH="$cli_root:$PATH" npm run test:sls-cli
      - name: Build
        run: npm run build
      - name: Real browser acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/issue-pilot-browsers
          ISSUE_PILOT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/issue-pilot-browser-tools/node_modules/playwright/index.mjs
        run: |
          npm install --prefix "${RUNNER_TEMP}/issue-pilot-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          "${RUNNER_TEMP}/issue-pilot-browser-tools/node_modules/.bin/playwright" install chromium --only-shell --with-deps
          npm run test:browser
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
